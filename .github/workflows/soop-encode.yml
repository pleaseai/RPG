name: Soop Encode

on:
  workflow_dispatch:
    inputs:
      force_encode:
        description: 'Force full re-encode, ignoring existing .soop/graph.json (use when graph is stale or corrupted)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.js'
      - '**/*.py'
      - '**/*.rs'
      - '**/*.go'
      - '**/*.java'
      - '!vendor/**'
      - '!**/node_modules/**'
      - '!**/dist/**'
      - '!**/build/**'
      - '!.soop/graph.json'
      - '!.soop/graph.meta.json'
      - '!.soop/embeddings.json'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2
        with:
          bun-version: latest

      - name: Install Repo Please
        run: bun install -g @pleaseai/soop@latest

      - name: Restore semantic cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .soop/cache/semantic-cache.db*
          key: semantic-cache-${{ github.sha }}
          restore-keys: semantic-cache-

      # tree-sitter grammars (native NAPI) download on demand and persist in the
      # cache dir pinned via SOOP_TS_CACHE_DIR. Caching it makes encode/evolve
      # deterministic and avoids re-downloading grammars on every run.
      - name: Restore tree-sitter parser cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .soop/cache/tree-sitter
          key: tree-sitter-pack-${{ github.sha }}
          restore-keys: tree-sitter-pack-

      - name: Encode or evolve RPG
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          FORCE_ENCODE: ${{ github.event.inputs.force_encode || 'false' }}
          SOOP_TS_CACHE_DIR: ${{ github.workspace }}/.soop/cache/tree-sitter
        run: |
          if [ "$FORCE_ENCODE" = "true" ]; then
            echo "force_encode=true — removing existing graph and running full encode"
            rm -f .soop/graph.json .soop/graph.meta.json .soop/embeddings.json
            mkdir -p .soop
            soop encode . -o .soop/graph.json -m google/gemini-3.1-flash-lite-preview
          elif [ ! -f ".soop/graph.json" ]; then
            echo "No existing graph — running full encode"
            mkdir -p .soop
            soop encode . -o .soop/graph.json -m google/gemini-3.1-flash-lite-preview
          else
            LAST_COMMIT=$(soop last-commit .soop/graph.json 2>/dev/null || echo "")
            if [ -z "$LAST_COMMIT" ]; then
              echo "No commit stamp — running full encode"
              soop encode . -o .soop/graph.json -m google/gemini-3.1-flash-lite-preview
            else
              echo "Evolving from $LAST_COMMIT..HEAD"
              soop evolve . -l .soop/graph.json -c "$LAST_COMMIT..HEAD" -m google/gemini-3.1-flash-lite-preview || {
                echo "Evolve failed, falling back to full encode"
                soop encode . -o .soop/graph.json -m google/gemini-3.1-flash-lite-preview
              }
            fi
          fi

      - name: Save semantic cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        if: always()
        with:
          path: .soop/cache/semantic-cache.db*
          key: semantic-cache-${{ github.sha }}

      - name: Save tree-sitter parser cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        if: always()
        with:
          path: .soop/cache/tree-sitter
          key: tree-sitter-pack-${{ github.sha }}

      - name: Create PR with updated graph
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore(soop): update graph'
          title: 'chore(soop): update graph'
          body: Auto-generated by Repo Encode workflow.
          branch: chore/soop-update-graph
          add-paths: .soop/
